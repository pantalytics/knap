# A pull request that goes green merges itself.
#
# Nothing here decides what green means. GitHub's own auto-merge does the
# waiting, and the branch ruleset on `main` names the checks it waits for. One
# list, in one place: a job added to ci.yml is not waited for until somebody
# adds it to the ruleset on purpose.
#
# This package has no deploy of its own, so a merge here is a merge and nothing
# more. It is knap-mcp-admin that ships, and it does so from a tag-pinned
# dependency rather than from main, so nothing reaches production because a
# pull request landed here.
#
# Three things are never merged:
#
#   - A draft. An agent opens its pull request as a draft, so draft is the hold
#     and Ready for review is the act that means ship it. Converting one back to
#     draft switches auto-merge off again.
#   - A pull request from a fork. Its checks run code the fork wrote, so a green
#     run says nothing about whether it should land. This package is meant to be
#     public, so that is the ordinary case rather than the exception.
#   - Anything at all, while AUTOMERGE_TOKEN is missing. That one warns and
#     stops rather than failing the job: without the token nothing merges, which
#     is the safe direction, and failing would put a red check on every pull
#     request in the repository for a setting somebody has not got to yet.
#
# AUTOMERGE_TOKEN is a fine-grained personal access token scoped to this
# repository alone, with Contents: read and write and Pull requests: read and
# write. Nothing else. The runner's own GITHUB_TOKEN is deliberately not used:
# a push it makes starts no workflow run, which costs nothing here and costs the
# whole deploy in knap-mcp-admin, so both repositories do the same thing for one
# reason rather than two things for none.
#
# ── What has to be switched on before this does anything ────────────────────
# 1. Settings -> General -> Pull Requests -> Allow auto-merge.
# 2. A ruleset on `main` with the CI checks required. Without one, a pull
#    request is mergeable the moment it is opened, there is nothing to wait for,
#    and `gh pr merge --auto` refuses with "Pull request is in clean status".
#    Settings -> Rules -> New branch ruleset, or:
#
#      gh api --method POST repos/pantalytics/knap/rulesets \
#        -f name='main' -f target='branch' -f enforcement='active' \
#        -F 'conditions[ref_name][include][]=~DEFAULT_BRANCH' \
#        -f 'rules[][type]=required_status_checks' \
#        -F 'rules[][parameters][strict_required_status_checks_policy]=false' \
#        -f 'rules[][parameters][required_status_checks][][context]=test (3.10)' \
#        -f 'rules[][parameters][required_status_checks][][context]=test (3.13)' \
#        -f 'rules[][parameters][required_status_checks][][context]=docker'
#
#    Those three are what ci.yml reports today: the test job once per Python in
#    its matrix, and the container build. A ruleset with no bypass actor also
#    stops a direct push to `main`; add Repository admin as a bypass in the UI
#    if that is not wanted.
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft]

# Nothing here reads the repository. The work is two API calls, made with a
# token that is not the runner's, so the runner's needs no reach at all.
permissions: {}

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # A fork's pull request is handed no secrets, so without this it would fail
    # on the token check below and paint every fork contribution red.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: The token has to be ours
        id: token
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTOMERGE_TOKEN is not set, so nothing merges itself. Add a fine-grained PAT with Contents and Pull requests write, scoped to this repository."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Switch auto-merge on, or off for a draft
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          on=$(gh pr view "$PR" --repo "$REPO" \
                 --json autoMergeRequest --jq '.autoMergeRequest != null')

          if [ "$DRAFT" = "true" ]; then
            if [ "$on" = "true" ]; then
              gh pr merge "$PR" --repo "$REPO" --disable-auto
              echo "Draft. Auto-merge switched off."
            else
              echo "Draft. Nothing to do until it is marked ready for review."
            fi
            exit 0
          fi

          if [ "$on" = "true" ]; then
            echo "Auto-merge is already on, and a push does not turn it off."
            exit 0
          fi

          # Squash: every commit on main is one pull request, and the history
          # says so. A failure here is usually one of the two settings in the
          # header, and the message gh prints names which.
          gh pr merge "$PR" --repo "$REPO" --auto --squash
          echo "Auto-merge on. This merges itself once the required checks pass."
