[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knap_mcp"]

[project]
name = "knap-mcp"
version = "0.1.0"
description = "MCP server over an Obsidian vault: read, search, write and relink plain markdown notes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
dependencies = [
    # Pinned below 2.0 to match odoo-mcp-pro and squirrel-mcp. mcp 2.0 renamed
    # FastMCP to MCPServer and removed mcp.server.fastmcp, so it is a rewrite of
    # create_fastmcp_app -- and that function is the seam the admin package
    # imports, so the three products move to 2.x together or not at all.
    "mcp>=1.27.2,<2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    # Obsidian frontmatter is real YAML: nested maps, lists, dates. Hand-rolling
    # a parser for it would mean silently misreading somebody's notes, so we
    # read with PyYAML. Writing is deliberately NOT a re-dump -- see
    # providers/filesystem/markdown.py:edit_frontmatter.
    "PyYAML>=6.0",
]

[project.scripts]
knap-mcp = "knap_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a1",
]

# Mirrors squirrel-mcp's ty configuration, with one deliberate difference:
# `unresolved-attribute` stays an error here. Squirrel silences it to live with
# the tool-mixin pattern; this package declares the seam in
# tools/vault/_base.py instead, so a real typo is still caught.
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["knap_mcp/"]
exclude = ["venv/", ".venv/", "build/", "dist/"]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
invalid-argument-type = "ignore"
invalid-parameter-default = "error"
invalid-return-type = "warn"
invalid-assignment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real vault on disk (a seeded tmpdir, no network)",
]
# A typo in a marker name would silently deselect a whole file, so an unknown
# one is an error rather than a warning.
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "Q"]
ignore = ["E501", "N818"]

[tool.ruff.format]
quote-style = "double"
